<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
// Bakes the full-body hero for the game: rest-pose mesh in metres (feet at y = 0, facing +z),
// skin weights and the skeleton, packed into one small binary. Driven by convert.js.
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
const HEIGHT = 1.8; // metres, top of the head to the soles
new FBXLoader().load('/model.fbx', (obj) => {
  let mesh; obj.traverse((o) => { if (o.isSkinnedMesh) mesh = o; });
  obj.updateMatrixWorld(true);
  mesh.skeleton.update();
  const G = mesh.geometry, A = G.attributes, nv = A.position.count, bm = mesh.skeleton.boneMatrices;
  const pre = new THREE.Matrix4().multiplyMatrices(mesh.matrixWorld, mesh.bindMatrixInverse);
  const M = new THREE.Matrix4(), T = new THREE.Matrix4(), B = new THREE.Matrix4(), N3 = new THREE.Matrix3();
  const P = new Float32Array(nv * 3), Nn = new Float32Array(nv * 3);
  const part = new Int8Array(nv).fill(-1);
  const partOf = { 'Suit.003': 0, 'Mask.003': 1, 'Metal28': 2, 'Right.002': 3, 'Left.002': 3, '_3_Web_Shooter': 4 };
  for (const g of G.groups) { const p = partOf[mesh.material[g.materialIndex].name]; if (p !== undefined) part.fill(p, g.start, g.start + g.count); }
  const v = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < nv; i++) {
    M.elements.fill(0);
    for (let k = 0; k < 4; k++) {
      const w = A.skinWeight.getComponent(i, k); if (!w) continue;
      B.fromArray(bm, A.skinIndex.getComponent(i, k) * 16);
      for (let e = 0; e < 16; e++) M.elements[e] += B.elements[e] * w;
    }
    T.multiplyMatrices(pre, M).multiply(mesh.bindMatrix);
    v.fromBufferAttribute(A.position, i).applyMatrix4(T); v.toArray(P, i * 3);
    N3.getNormalMatrix(T);
    n.fromBufferAttribute(A.normal, i).applyMatrix3(N3).normalize(); n.toArray(Nn, i * 3);
  }
  // metres, feet on y = 0, centred on the hips
  const bones = mesh.skeleton.bones;
  const hips = bones.find((b) => /Hips$/.test(b.name)).getWorldPosition(new THREE.Vector3());
  let ymin = 1e9, ymax = -1e9;
  for (let i = 0; i < nv; i++) { ymin = Math.min(ymin, P[i * 3 + 1]); ymax = Math.max(ymax, P[i * 3 + 1]); }
  const s = HEIGHT / (ymax - ymin);
  const norm = (x, y, z) => [(x - hips.x) * s, (y - ymin) * s, (z - hips.z) * s];
  for (let i = 0; i < nv; i++) { const q = norm(P[i * 3], P[i * 3 + 1], P[i * 3 + 2]); P[i * 3] = q[0]; P[i * 3 + 1] = q[1]; P[i * 3 + 2] = q[2]; }
  // the lens and frame on one side were mirrored inside out
  const head = new THREE.Vector3(0, 0, 0); let hn = 0;
  for (let i = 0; i < nv; i++) if (part[i] === 3) { head.x += P[i * 3]; head.y += P[i * 3 + 1]; head.z += P[i * 3 + 2]; hn++; }
  head.multiplyScalar(1 / hn); head.x = 0; head.z -= 0.08;
  const inverted = {};
  for (const pt of [2, 3]) for (const side of [-1, 1]) {
    let acc = 0;
    for (let i = 0; i < nv; i++) if (part[i] === pt && Math.sign(P[i * 3]) === side) acc += Nn[i * 3] * (P[i * 3] - head.x) + Nn[i * 3 + 1] * (P[i * 3 + 1] - head.y) + Nn[i * 3 + 2] * (P[i * 3 + 2] - head.z);
    inverted[pt + ':' + side] = acc < 0;
    if (acc < 0) for (let i = 0; i < nv; i++) if (part[i] === pt && Math.sign(P[i * 3]) === side) { Nn[i * 3] *= -1; Nn[i * 3 + 1] *= -1; Nn[i * 3 + 2] *= -1; }
  }
  // fix winding against the normals, then weld
  const map = new Map(), out = [], verts = [];
  const key = (i) => [part[i], Math.round(P[i * 3] * 1e5), Math.round(P[i * 3 + 1] * 1e5), Math.round(P[i * 3 + 2] * 1e5), Math.round(Nn[i * 3] * 100), Math.round(Nn[i * 3 + 1] * 100), Math.round(Nn[i * 3 + 2] * 100), Math.round(A.uv.getX(i) * 1e5), Math.round(A.uv.getY(i) * 1e5)].join(',');
  const idx = (i) => { const k = key(i); let j = map.get(k); if (j === undefined) { j = verts.length; map.set(k, j); verts.push(i); } return j; };
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), fn = new THREE.Vector3(), an = new THREE.Vector3();
  for (let t = 0; t < nv; t += 3) {
    if (part[t] < 0) continue;
    a.fromArray(P, t * 3); b.fromArray(P, t * 3 + 3); c.fromArray(P, t * 3 + 6);
    fn.crossVectors(b.clone().sub(a), c.clone().sub(a));
    an.fromArray(Nn, t * 3).add(new THREE.Vector3().fromArray(Nn, t * 3 + 3)).add(new THREE.Vector3().fromArray(Nn, t * 3 + 6));
    if (fn.dot(an) < 0) out.push(idx(t), idx(t + 2), idx(t + 1)); else out.push(idx(t), idx(t + 1), idx(t + 2));
  }
  const V = verts.length, Tn = out.length / 3;
  const bb = [1e9, 1e9, 1e9, -1e9, -1e9, -1e9];
  for (const i of verts) for (let k = 0; k < 3; k++) { bb[k] = Math.min(bb[k], P[i * 3 + k]); bb[k + 3] = Math.max(bb[k + 3], P[i * 3 + k]); }
  const pos = new Uint16Array(V * 3), nor = new Int8Array(V * 4), uv = new Uint16Array(V * 2), prt = new Uint8Array(V + (4 - V % 4) % 4);
  const si = new Uint8Array(V * 4), sw = new Uint8Array(V * 4);
  verts.forEach((i, j) => {
    for (let k = 0; k < 3; k++) pos[j * 3 + k] = Math.round((P[i * 3 + k] - bb[k]) / (bb[k + 3] - bb[k]) * 65535);
    for (let k = 0; k < 3; k++) nor[j * 4 + k] = Math.round(Nn[i * 3 + k] * 127);
    let u = A.uv.getX(i), w = A.uv.getY(i);
    if (part[i] <= 1) w -= 2;
    if (part[i] === 2 || part[i] === 4) { u = 0; w = 0; }
    uv[j * 2] = Math.round(Math.min(1, Math.max(0, u)) * 65535); uv[j * 2 + 1] = Math.round(Math.min(1, Math.max(0, w)) * 65535);
    prt[j] = part[i];
    const ws = [0, 1, 2, 3].map((k) => A.skinWeight.getComponent(i, k)), tot = ws.reduce((x, y) => x + y, 0) || 1;
    let q = ws.map((x) => Math.round(x / tot * 255)), diff = 255 - q.reduce((x, y) => x + y, 0);
    q[q.indexOf(Math.max(...q))] += diff;
    for (let k = 0; k < 4; k++) { si[j * 4 + k] = q[k] ? A.skinIndex.getComponent(i, k) : 0; sw[j * 4 + k] = q[k]; }
  });
  const index = V > 65535 ? new Uint32Array(out) : new Uint16Array(out);
  // the skeleton at rest, in the same metres
  const boneData = bones.map((bn) => {
    const wp = bn.getWorldPosition(new THREE.Vector3()), wq = bn.getWorldQuaternion(new THREE.Quaternion());
    const q = norm(wp.x, wp.y, wp.z);
    return [bn.name.replace(/^mixamorig:?/, ''), bones.indexOf(bn.parent), q.map((x) => +x.toFixed(5)), wq.toArray().map((x) => +x.toFixed(6))];
  });
  const chunks = [['pos', pos], ['nor', nor], ['uv', uv], ['part', prt], ['skinIndex', si], ['skinWeight', sw], ['index', index]];
  const meta = { V, T: Tn, bb: bb.map((x) => +x.toFixed(5)), bones: boneData, layout: [] };
  let total = 0;
  for (const [name, arr] of chunks) { meta.layout.push([name, total, arr.length, arr.constructor.name]); total += arr.byteLength; total += (4 - (total % 4)) % 4; }
  const buf = new Uint8Array(total);
  meta.layout.forEach(([name, off], k) => buf.set(new Uint8Array(chunks[k][1].buffer, chunks[k][1].byteOffset, chunks[k][1].byteLength), off));
  let bin = ''; for (let i = 0; i < buf.length; i += 32768) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 32768));
  window.OUT = { meta, b64: btoa(bin) };
  window.INFO = { V, T: Tn, bytes: total, bones: boneData.length, inverted, scale: s, bb: meta.bb, sample: boneData.slice(0, 3) };
  window.DONE = true;
}, undefined, (e) => { window.INFO = { error: String(e && e.message || e) }; window.DONE = true; });
</script></body></html>
