<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <title>Spider-Man: Rebirth</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app" data-screen="boot">
    <canvas id="gl" aria-hidden="true"></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="scrim" aria-hidden="true"></div>

    <h1 class="logo" id="logo" aria-label="Spider-Man: Rebirth"></h1>
    <div class="ticker" aria-hidden="true">
      <div class="paper"><span>The Daily Bugle</span></div>
      <div class="news" id="news"></div>
    </div>

    <div id="screens"></div>

    <div class="hints" id="hints" aria-hidden="true"></div>
    <div class="meta" id="meta"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="fps" id="fps" hidden></div>
    <div class="fade" id="fade" aria-hidden="true"></div>
  </div>
  <noscript>Spider-Man: Rebirth needs JavaScript switched on.</noscript>

  <script src="vendor/three.min.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/emblem.js"></script>
  <script src="js/core/content.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/audio.js"></script>
  <script src="js/core/input.js"></script>
  <script src="js/scene/palettes.js"></script>
  <script src="js/scene/heroart.js"></script>
  <script src="js/scene/bust.js"></script>
  <script src="js/scene/web.js"></script>
  <script src="js/scene/fx.js"></script>
  <script src="js/scene/stage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
